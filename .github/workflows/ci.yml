name: comprehensive

# Run explicitly on the branch/commit under review. Fast checks run in fast.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          version: "0.12.23"
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run --no-sync poe check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.12.23"
      - run: uv sync --frozen
      # ROM tests may use jericho_games to download their fixtures on demand.
      # Do not upload or cache the games directory as a workflow artifact.
      - run: uv run --no-sync poe test

  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          version: "0.12.23"
      # Jericho is a development-only black-box reference, built by uv.
      # Ubuntu runners provide gcc and make; no interpreter source is inspected.
      - run: uv sync --frozen --group reference
      # Use only the packaged Frotz executable for synthetic comparisons.
      - name: Install Frotz reference binary
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends frotz
          /usr/games/dfrotz -v
      # This job downloads the ROM fixture. Do not upload or cache it.
      - run: uv run --no-sync poe test-roms
      # Require the full seeded Zork walkthrough, reset, and checkpoint replay at every turn.
      # Include state transfers in both directions and continuation through the ending.
      # Require Quetzal file interchange and the walkthrough with save/restore opcodes.
      # Require in-game restart, RNG reseeding, and the full walkthrough after restart.
      # Compare environment copies, deferred host seeds, and score/move queries.
      # Compare locations (including vehicles), score limits, and loss/victory queries.
      # Compare raw world objects, direct lookup, player, and inventory throughout
      # the walkthrough, including detached snapshots, vehicles, and death states.
      # Branch off the walkthrough with invalid inputs, red herrings, and seeded combat.
      # Compare transcripts and complete converted VM state after every detour turn.
      - run: uv run --no-sync poe test-reference-core
      # Regenerate public reference measurements and specification-derived
      # story metadata in memory. Require both ZIPs to match without rewriting.
      - run: uv run --no-sync poe check-vectors --only storyfiles
      - run: uv run --no-sync poe check-vectors --only zork1
      - run: uv run --no-sync poe check-vectors --only 905
      - run: uv run --no-sync poe test-vectors-core

  reference-v3:
    name: reference V3 (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          version: "0.12.23"
      - run: uv sync --frozen --group reference
      # Compare every additional V3 game directly through public Jericho APIs,
      # then require its committed hashes to match fresh reference measurements.
      - run: uv run --no-sync poe test-v3-reference --v3-shard ${{ matrix.shard }}
      - run: uv run --no-sync poe check-vectors --only v3 --v3-shard ${{ matrix.shard }}

  reference-v5:
    name: reference V5
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          version: "0.12.23"
      - run: uv sync --frozen --group reference
      - run: uv run --no-sync poe test-v5-reference
      - run: uv run --no-sync poe check-vectors --only v5

  portable:
    name: portable (${{ matrix.os }}, Python 3.12, ${{ matrix.group }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Hosted x64 Windows is Server 2025; ARM uses Windows 11.
        os: [macos-latest, windows-2025, windows-11-arm]
        group: [core, "1/3", "2/3", "3/3", v5]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          version: "0.12.23"
      - run: uv sync --frozen
      - run: uv run --no-sync python -c "import importlib.util; assert importlib.util.find_spec('jericho') is None"
      - if: matrix.group == 'core'
        run: uv run --no-sync poe test
      # Read both ZIPs directly: all 56 story files' metadata/memory/CLI info,
      # plus Zork gameplay. Only the existing ROM fixture downloads games;
      # do not cache or upload the games directory.
      - if: matrix.group == 'core'
        run: uv run --no-sync poe test-vectors-core
      - if: matrix.group != 'core' && matrix.group != 'v5'
        run: uv run --no-sync poe test-v3-vectors --v3-shard ${{ matrix.group }}
      - if: matrix.group == 'v5'
        run: uv run --no-sync poe test-v5-vectors

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          version: "0.12.23"
      - run: uv sync --frozen
      - run: uv run --no-sync poe build-check
