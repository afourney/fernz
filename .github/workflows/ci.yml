name: check

# Always report each job, including on documentation-only pull requests.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          version: "0.12.23"
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run --no-sync poe check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.12.23"
      - run: uv sync --frozen
      # ROM tests may use jericho_games to download their fixtures on demand.
      # Do not upload or cache the games directory as a workflow artifact.
      - run: uv run --no-sync poe test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          version: "0.12.23"
      - run: uv sync --frozen
      - run: uv run --no-sync poe build-check
