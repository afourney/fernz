[project]
name = "fernz"
version = "0.0.0a1"
description = "Fernz"
readme = "README.md"
authors = [
    { name = "Adam Fourney", email = "adam.fourney@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fernz = "fernz._cli:main"

[dependency-groups]
dev = [
    "codespell",
    "poethepoet",
    "pytest>=8",
    "ruff",
]
reference = [
    "jericho==3.3.1",
]

[tool.uv.dependency-groups]
reference = { requires-python = "==3.11.*" }

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not reference and not rom'"
markers = [
    "smoke: bounded real-game and live reference checks for fast pull-request CI",
    "reference: black-box comparisons requiring Jericho and downloaded ROMs",
    "rom: loading, memory, and gameplay tests using downloaded story files",
    "vectors: portable story metadata and gameplay comparisons using committed ZIPs (no Jericho)",
    "v3games: comprehensive gameplay checks for the additional retained V3 stories",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
extend-exclude = ["games"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "D",   # docstrings
    "SIM", # flake8-simplify
    "BLE", # flake8-blind-except
    "ISC", # implicit string concatenation
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",  # the formatter handles line lengths
    "UP017", # datetime.UTC alias
    "D203",  # use D211: no blank line before class
    "D213",  # use D212: summary on the first line
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.poe.tasks]
format = "ruff format --check --diff src tests scripts"
format-fix = "ruff format src tests scripts"
lint = "ruff check src tests scripts"
lint-fix = "ruff check --fix src tests scripts"
# Keep downloaded ROMs and deliberately malformed test inputs out of spell checks.
spell = "codespell --check-hidden src scripts docs README.md pyproject.toml .github"
test = "pytest"
test-fast = "pytest -m 'not reference and (not rom or smoke)' -ra --tb=short --durations=10"
test-fast-reference = "pytest -m 'reference and smoke' -ra --tb=short --durations=10"
test-full = ["test", "test-roms", "test-reference", "test-vectors", "check-vectors"]
test-roms = "pytest -m 'rom and not vectors' -ra"
test-reference = "pytest -m reference -ra --tb=short"
test-vectors = "pytest -m vectors -ra --tb=short"
test-reference-core = "pytest -m 'reference and not v3games' -ra --tb=short"
test-vectors-core = "pytest -m 'vectors and not v3games' -ra --tb=short"
test-v3-reference = "pytest -m 'reference and v3games' -ra --tb=short"
test-v3-vectors = "pytest -m 'vectors and v3games' -ra --tb=short"
generate-vectors = "python -m tests.scripts.generate_zork1_vectors"
check-vectors = "python -m tests.scripts.generate_zork1_vectors --check"
build = "uv build --out-dir dist"
check-dist = "python scripts/check_dist.py"
build-check = ["build", "check-dist"]
check = ["format", "lint", "spell"]
check-all = ["check", "test", "build-check"]
fix-all = ["format-fix", "lint-fix"]
